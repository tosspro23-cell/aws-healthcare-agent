name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable) with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Mypy (type check)
        run: mypy src

      - name: Pytest (with coverage)
        run: pytest -q --cov=care_agent --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  smoke:
    name: CLI smoke test (no API key, no network)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Run the required sample scenario end-to-end
        run: |
          python -m care_agent ask "My LDL and HbA1c are high. What should I focus on first, and does my questionnaire change the advice?" --trace

      - name: Run all shipped sample questions end-to-end
        run: python -m care_agent eval-samples

      - name: Regenerate example output (smoke-tests scripts/run_examples.py)
        run: python scripts/run_examples.py

      - name: Capability regression eval (also gated in pytest -- this exercises the CLI entrypoint and produces the report artifact)
        run: python -m care_agent eval-capabilities --report eval-report.json

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json

  update-eval-history:
    name: Update eval history (main only)
    runs-on: ubuntu-latest
    needs: smoke
    # Only for a real push to main -- not a PR (would commit to a branch
    # nobody asked for) and not workflow_dispatch/other events. The bot's
    # own commit below carries [skip ci], which GitHub Actions recognizes
    # natively and skips triggering this workflow again for it -- without
    # that, this job's own push would trigger another run of itself.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Regenerate docs/EVAL_HISTORY.md
        run: python scripts/update_eval_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/EVAL_HISTORY.md docs/eval_history.jsonl docs/eval_trend.svg; then
            echo "No change to docs/EVAL_HISTORY.md, docs/eval_history.jsonl, or docs/eval_trend.svg -- nothing to commit."
          else
            git add docs/EVAL_HISTORY.md docs/eval_history.jsonl docs/eval_trend.svg
            git commit -m "chore: update eval history [skip ci]"
            git push
          fi

  infra:
    name: infra (cdk synth + cdk-nag + moto-mocked tests, no live AWS account)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements*.txt

      - name: Set up Node (for the CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Install infra dependencies
        working-directory: infra
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        working-directory: infra
        run: ruff check . --line-length=140

      - name: Mypy (type check)
        working-directory: infra
        run: mypy stacks app.py lambda_src build_lambda_asset.py scripts/get_dev_token.py scripts/stress_test.py --ignore-missing-imports

      - name: Pytest (stack assertions + moto-mocked Lambda handler tests)
        working-directory: infra
        run: pytest tests/ -v

      - name: cdk synth (compiles the app + cdk-nag security scan; no deploy, no credentials)
        working-directory: infra
        run: cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: "us-east-1"

  frontend:
    name: frontend (lint, type-check, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: Build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build

  check-deploy-paths:
    name: Check whether this push touches anything actually deployed
    runs-on: ubuntu-latest
    # Independent of test/smoke/infra/frontend -- pure git-diff, so it
    # finishes well before deploy would need its answer instead of
    # adding to the critical path.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      deploy_relevant: ${{ steps.filter.outputs.deploy_relevant }}
    steps:
      - name: Checkout (full history -- the pre-push commit must be present locally to diff against)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this push changed anything cdk deploy or the built assets would actually pick up
        id: filter
        run: |
          # github.event.before is all-zeros for a push that creates a
          # branch (nothing to diff against) -- deploy rather than guess.
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to diff against (new branch) -- deploying to be safe."
            echo "deploy_relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Files changed by this push:"
          echo "$CHANGED"

          # infra/ (CDK stacks + Lambda handlers), frontend/ (the built
          # Workbench), src/care_agent/ and data/ (both copied wholesale
          # into the Lambda asset by infra/build_lambda_asset.py -- see
          # its own docstring -- so *any* change under either changes
          # the deployed code's own content hash, even a module no
          # handler imports), and this workflow file itself (a change
          # to the deploy job's own steps is best confirmed by actually
          # running them). Deliberately coarse per-directory, not
          # per-file: under-matching would silently skip a deploy that
          # should have happened, which is the one failure mode worse
          # than an unnecessary approval prompt. docs/, README.md,
          # scripts/ (dev-only tooling, never bundled into any deployed
          # asset), and tests/ are the common case this exists to skip.
          if echo "$CHANGED" | grep -Eq '^(infra/|frontend/|src/care_agent/|data/|\.github/workflows/ci\.yml)'; then
            echo "deploy_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_relevant=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to AWS (main only, requires manual approval)
    runs-on: ubuntu-latest
    needs: [test, smoke, infra, frontend, check-deploy-paths]
    # Only a real push to main (never a PR -- a fork's PR could not
    # assume this role anyway, since the OIDC trust condition below is
    # scoped to this exact ref, but this also keeps a PR run from ever
    # reaching the `environment: production` approval prompt at all),
    # and only when check-deploy-paths found something actually
    # deployed changed -- a docs-only or scripts-only push shouldn't
    # cost a human a manual approval for a deploy that would change
    # nothing in AWS.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.check-deploy-paths.outputs.deploy_relevant == 'true'
    environment: production
    permissions:
      # id-token: write is what lets this job request an OIDC token from
      # GitHub to exchange for short-lived AWS credentials -- no stored
      # AWS secret anywhere in this repo. See infra/stacks/cicd_stack.py.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored secret)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements*.txt

      - name: Set up Node (for the CDK CLI and the frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Install infra dependencies
        working-directory: infra
        run: pip install -r requirements.txt -r requirements-dev.txt

      # frontend/.env.local is gitignored (see its own .env.example) and
      # holds no secret -- every value in it ends up embedded in the
      # publicly-served JS bundle regardless (a public Cognito app client
      # ID and a public API URL, not a credential). Read fresh from the
      # stacks' own CloudFormation outputs rather than duplicating them
      # into a GitHub variable that could drift out of sync.
      - name: Write frontend/.env.local from the currently deployed stacks
        run: |
          COGNITO_DOMAIN=$(aws cloudformation describe-stacks --stack-name CareAgentAuthStack --query "Stacks[0].Outputs[?OutputKey=='HostedUiDomain'].OutputValue" --output text)
          APP_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name CareAgentAuthStack --query "Stacks[0].Outputs[?OutputKey=='AppClientId'].OutputValue" --output text)
          API_URL=$(aws cloudformation describe-stacks --stack-name CareAgentApiStack --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          {
            echo "VITE_COGNITO_DOMAIN=$COGNITO_DOMAIN"
            echo "VITE_COGNITO_APP_CLIENT_ID=$APP_CLIENT_ID"
            echo "VITE_API_BASE_URL=$API_URL"
          } > frontend/.env.local

      - name: cdk deploy --all
        working-directory: infra
        run: cdk deploy --all --require-approval never
        env:
          # See app.py's own docstring on the two-pass deployment pattern
          # -- both of these are already known (this isn't this app's
          # first-ever deploy), so both are set on every run.
          CARE_AGENT_WORKBENCH_URL: ${{ vars.CARE_AGENT_WORKBENCH_URL }}
          CARE_AGENT_BUDGET_EMAIL: ${{ secrets.CARE_AGENT_BUDGET_EMAIL }}
