name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable) with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Mypy (type check)
        run: mypy src

      - name: Pytest (with coverage)
        run: pytest -q --cov=care_agent --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  smoke:
    name: CLI smoke test (no API key, no network)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Run the required sample scenario end-to-end
        run: |
          python -m care_agent ask "My LDL and HbA1c are high. What should I focus on first, and does my questionnaire change the advice?" --trace

      - name: Run all shipped sample questions end-to-end
        run: python -m care_agent eval-samples

      - name: Regenerate example output (smoke-tests scripts/run_examples.py)
        run: python scripts/run_examples.py

      - name: Capability regression eval (also gated in pytest -- this exercises the CLI entrypoint and produces the report artifact)
        run: python -m care_agent eval-capabilities --report eval-report.json

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json

  update-eval-history:
    name: Update eval history (main only)
    runs-on: ubuntu-latest
    needs: smoke
    # Only for a real push to main -- not a PR (would commit to a branch
    # nobody asked for) and not workflow_dispatch/other events. The bot's
    # own commit below carries [skip ci], which GitHub Actions recognizes
    # natively and skips triggering this workflow again for it -- without
    # that, this job's own push would trigger another run of itself.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Regenerate docs/EVAL_HISTORY.md
        run: python scripts/update_eval_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/EVAL_HISTORY.md; then
            echo "No change to docs/EVAL_HISTORY.md -- nothing to commit."
          else
            git add docs/EVAL_HISTORY.md
            git commit -m "chore: update eval history [skip ci]"
            git push
          fi

  infra:
    name: infra (cdk synth + moto-mocked tests, no live AWS account)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements*.txt

      - name: Set up Node (for the CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Install infra dependencies
        working-directory: infra
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        working-directory: infra
        run: ruff check . --line-length=140

      - name: Mypy (type check)
        working-directory: infra
        run: mypy stacks app.py lambda_src build_lambda_asset.py scripts/get_dev_token.py scripts/stress_test.py --ignore-missing-imports

      - name: Pytest (stack assertions + moto-mocked Lambda handler tests)
        working-directory: infra
        run: pytest tests/ -v

      - name: cdk synth (validates the CDK app compiles; no deploy, no credentials)
        working-directory: infra
        run: cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: "us-east-1"

  frontend:
    name: frontend (lint, type-check, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: Build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build
